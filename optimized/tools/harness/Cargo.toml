[package]
name = "shrincs-harness"
version = "0.1.0"
edition = "2021"
publish = false

# SimplicityHL master (simplicity-lang 0.9.0): same cost model as the bundled binary, fixed pruning.
[dependencies]
simplicityhl = { git = "https://github.com/BlockstreamResearch/SimplicityHL", rev = "351eb06", features = ["serde"] }
serde_json = "1"

[[bin]]
name = "measure"
path = "src/measure.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"
